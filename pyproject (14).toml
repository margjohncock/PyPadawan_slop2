
[project]
name = "PyPadawan"
version = "0.3.0"
description = "Local, evidence-based guidance for understanding Python research projects."
readme = "README.md"
requires-python = ">=3.11"

# Packages needed to run the application
dependencies = [
    "streamlit>=1.40",
    "packaging>=24.0",
    "PyYAML>=6.0.2",
    "markdown-it-py>=3.0",
    "docutils>=0.21",
    "nbformat>=5.10",
]

# Packages needed for development and testing
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

# Configuration for pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
norecursedirs = ["fixtures"]

# Configuration for Ruff (linting)
[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

# Build configuration
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["app", "archive_handler", "gitignore_generator", "guidance", "inspector", "source_reader", "project_readers", "understanding", "understanding_view", "document_reader", "legacy_reader", "walkthroughs"]
packages = ["pypadawan_guides"]

[tool.setuptools.package-data]
pypadawan_guides = ["*.yml"]

